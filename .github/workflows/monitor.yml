name: Bazoš dopyt monitor

# Beží automaticky každé 3 hodiny + dá sa spustiť aj ručne.
# POZOR: naplánovaný (schedule) beh GitHub spúšťa IBA z DEFAULT vetvy (main).
# Preto, aby to bežalo 3 dni samo, musí byť tento súbor na main.
on:
  schedule:
    - cron: "0 */3 * * *"   # každé 3 hodiny (UTC)
  workflow_dispatch:         # ručné spustenie z GitHub UI / API

# Nech sa behy neprekrývajú (kvôli commitu stavu späť do repa).
concurrency:
  group: bazos-monitor
  cancel-in-progress: false

permissions:
  contents: write            # aby mohol commitnúť DB + reporty späť
  pages: write               # deploy dashboardu na GitHub Pages
  id-token: write            # OIDC pre deploy-pages

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Crawl listingov
        run: python -m bazos_monitor.cli --config config.example.yaml --db data/bazos.db crawl

      - name: Sweep (detekcia zmazaní = životnosť)
        run: python -m bazos_monitor.cli --config config.example.yaml --db data/bazos.db sweep

      - name: Retencia (orež staré dáta, drž DB malú)
        run: python -m bazos_monitor.cli --db data/bazos.db prune --keep-days 200

      - name: Generuj reporty
        run: |
          mkdir -p reports
          python -m bazos_monitor.cli --db data/bazos.db report --window 30 --max-age 21 --top 50 > reports/dopyt.txt
          python -m bazos_monitor.cli --db data/bazos.db report --window 30 --max-age 21 --top 200 --csv reports/dopyt.csv > /dev/null
          python -m bazos_monitor.cli --db data/bazos.db arbitraz --window 30 --min-price 100 --max-price 3000 --max-age 21 --top 50 > reports/arbitraz.txt
          python -m bazos_monitor.cli --db data/bazos.db arbitraz --window 30 --min-price 100 --max-price 3000 --max-age 21 --top 200 --csv reports/arbitraz.csv > /dev/null
          : > reports/zhrnutie.txt
          for c in zahrada dom nabytok stroje elektro sport deti hudba; do
            python -m bazos_monitor.cli --db data/bazos.db zhrnutie --category "$c" --window 30 --max-age 21 --top 8 >> reports/zhrnutie.txt
            echo "" >> reports/zhrnutie.txt
          done
          python -m bazos_monitor.cli --config config.example.yaml --db data/bazos.db export --out reports/data.json --window 30 --max-age 21
          echo "Posledný beh: $(date -u '+%Y-%m-%d %H:%M UTC')" > reports/_last_run.txt

      - name: Commit stavu a reportov
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/bazos.db reports/
          if git diff --cached --quiet; then
            echo "Žiadne zmeny na commit."
          else
            git commit -m "data: crawl + reporty $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Nahraj reporty aj ako artifact
        uses: actions/upload-artifact@v4
        with:
          name: reporty
          path: reports/
          retention-days: 14

      # ----- Dashboard na GitHub Pages (privátny repo, platený plán) -----
      - name: Priprav stránku
        run: |
          mkdir -p site
          cp dashboard/index.html site/index.html
          cp reports/data.json site/data.json

      # Pages kroky sú nefatálne: kým Pages nie sú v repe raz zapnuté
      # (Settings → Pages → Source: GitHub Actions), zber dát ostáva zelený.
      - name: Nastav Pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Nahraj Pages artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy na Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
