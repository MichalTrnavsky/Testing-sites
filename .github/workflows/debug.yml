name: Debug podkategórie

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Zoznam podkategórií
        run: |
          mkdir -p reports
          python -m bazos_monitor.cli --config config.example.yaml subcats > reports/_debug_subcats.txt 2>&1 || true
          cat reports/_debug_subcats.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/_debug_subcats.txt
          git commit -m "debug: struktúra podkategórií [skip ci]" || echo "nič"
          git push origin HEAD:${{ github.ref_name }} || echo "push fail"
